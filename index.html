<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebecca Arnaud Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --acc:#5b5bd6; --acc-tint:color-mix(in srgb, var(--acc) 12%, #fff); --acc-tint2:color-mix(in srgb, var(--acc) 6%, #fff);
    --acc-dark:color-mix(in srgb, var(--acc) 84%, #000);
    --bg:#f5f5f8; --surface:#ffffff; --border:#e9e9ef; --border-subtle:#eef0f3; --input-bg:#fafafc;
    --text-primary:#1a1a22; --text-secondary:#6a6a76; --text-muted:#9a9aa6; --text-faint:#b0b0ba;
    --positive-fg:#16794f; --positive-bg:#e4f4ec; --negative-fg:#c14a43; --negative-bg:#fbe9e7;
    --warn-fg:#8a5a12; --warn-bg:#f6eedd; --acc-badge-fg:#4646b8; --acc-badge-bg:#ececfb;
    --toast-bg:#1a1a22; --radius:14px;
  }
  
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:'Instrument Sans',system-ui,sans-serif; background:var(--bg); color:var(--text-primary);
    -webkit-font-smoothing:antialiased; letter-spacing:-0.01em;
  }
  button,input{ font-family:inherit; }
  ::-webkit-scrollbar{ width:11px; height:11px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:20px; border:3px solid var(--bg); }
  .app{ display:flex; height:100vh; overflow:hidden; }

  
  aside{ width:246px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:22px 16px; }
  .brand{ display:flex; align-items:center; gap:11px; padding:4px 8px 22px; }
  .brand .tile{ width:38px; height:38px; border-radius:10px; background:var(--acc-tint);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brand .tile img{ width:24px; height:24px; object-fit:contain; }
  .brand .lines{ display:flex; flex-direction:column; line-height:1.15; }
  .brand .name{ font-family:'Space Grotesk'; font-weight:600; font-size:15px; letter-spacing:-0.02em; }
  .brand .sub{ font-size:11.5px; color:var(--text-muted); font-weight:500; }
  .eyebrow{ font-size:10.5px; font-weight:600; letter-spacing:0.08em; color:var(--text-faint); padding:6px 10px 8px; }
  nav{ display:flex; flex-direction:column; gap:3px; }
  nav .item{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:9px;
    font-size:13.5px; font-weight:500; color:var(--text-secondary); cursor:pointer; transition:background .15s; }
  nav .item:hover{ background:var(--acc-tint2); }
  nav .item.active{ background:var(--acc-tint); color:var(--acc); font-weight:600; }
  nav .item svg{ flex-shrink:0; }
  .sidebar-spacer{ flex:1; }
  .sidebar-footer{ border-top:1px solid var(--border-subtle); padding-top:14px; display:flex; align-items:center;
    gap:11px; padding-left:8px; padding-right:8px; }
  .avatar-round{ width:34px; height:34px; border-radius:50%; background:var(--acc); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px;
    font-family:'Space Grotesk'; flex-shrink:0; }
  .sidebar-footer .lines{ display:flex; flex-direction:column; line-height:1.2; min-width:0; }
  .sidebar-footer .name{ font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sidebar-footer .sub{ font-size:11px; color:var(--text-muted); }

  
  main{ flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
  header.topbar{ flex-shrink:0; min-height:70px; background:var(--surface); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; padding:14px 28px; gap:20px; flex-wrap:wrap; }
  .topbar .titles{ display:flex; flex-direction:column; line-height:1.2; }
  .topbar h1{ margin:0; font-family:'Space Grotesk'; font-size:19px; font-weight:600; letter-spacing:-0.02em; }
  .topbar .sub{ font-size:12.5px; color:var(--text-muted); font-weight:500; }
  .topbar .controls{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }

  .search-wrap{ position:relative; display:flex; align-items:center; }
  .search-wrap svg{ position:absolute; left:11px; pointer-events:none; }
  .search-wrap input{ height:38px; width:180px; border:1px solid var(--border); background:var(--input-bg);
    border-radius:9px; padding:0 12px 0 32px; font-size:13.5px; outline:none; color:var(--text-primary); }
  .search-wrap input:focus{ border-color:var(--acc); }

  .week-toggle{ display:flex; align-items:center; gap:6px; background:var(--bg); border-radius:9px; padding:4px 6px; }
  .week-toggle button{ border:none; background:transparent; color:var(--text-secondary); cursor:pointer;
    width:26px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center; }
  .week-toggle button:hover:not(:disabled){ background:var(--surface); }
  .week-toggle button:disabled{ opacity:.3; cursor:default; }
  .week-toggle .label{ font-size:12.5px; font-weight:600; padding:0 6px; white-space:nowrap; }

  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{ padding:6px 12px; border-radius:20px; border:1px solid var(--border); background:var(--surface);
    color:var(--text-secondary); font-size:12.5px; font-weight:600; cursor:pointer; transition:all .15s; }
  .chip:hover{ background:var(--acc-tint2); }
  .chip.active{ background:var(--acc); color:#fff; border-color:var(--acc); }

  .segmented{ display:flex; background:var(--bg); border-radius:9px; padding:3px; gap:2px; }
  .segmented button{ padding:6px 13px; border:none; border-radius:7px; font-weight:600; font-size:12.5px;
    cursor:pointer; transition:all .15s; background:transparent; color:var(--text-muted); }
  .segmented button.active{ background:var(--surface); color:var(--text-primary); box-shadow:0 1px 3px rgba(20,20,40,0.10); }

  .scrollbody{ flex:1; overflow-y:auto; padding:22px 28px 40px; }

  
  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:16px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }
  .kpi{ padding:18px 18px 16px; }
  .kpi .top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .kpi .lbl{ font-size:12.5px; color:var(--text-muted); font-weight:600; }
  .kpi .badge-pill{ display:inline-flex; align-items:center; gap:3px; font-size:11.5px; font-weight:600;
    padding:2px 8px; border-radius:20px; }
  .kpi .value{ font-family:'Space Grotesk'; font-size:30px; font-weight:600; letter-spacing:-0.03em; line-height:1; }
  .kpi .note{ font-size:11.5px; color:var(--text-muted); margin-top:8px; }

  .badge{ display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:600; padding:3px 10px; border-radius:20px; }
  .badge.acc{ background:var(--acc-badge-bg); color:var(--acc-badge-fg); }
  .badge.pos{ background:var(--positive-bg); color:var(--positive-fg); }
  .badge.warn{ background:var(--warn-bg); color:var(--warn-fg); }
  .badge.neutral{ background:var(--border-subtle); color:var(--text-secondary); }

  
  .charts-row{ display:grid; grid-template-columns:1.5fr 1fr; gap:16px; margin-bottom:16px; }
  .panel{ padding:20px; }
  .panel .title{ font-family:'Space Grotesk'; font-size:15px; font-weight:600; }
  .panel .desc{ font-size:12.5px; color:var(--text-muted); margin-top:2px; margin-bottom:16px; }
  .funnel-row{ margin-bottom:14px; }
  .funnel-row .head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .funnel-row .stage{ font-size:13px; font-weight:600; color:var(--text-primary); }
  .funnel-row .count{ font-size:12.5px; color:var(--text-muted); font-weight:500; }
  .funnel-row .count b{ color:var(--text-primary); font-weight:600; }
  .bar-track{ height:9px; background:var(--border-subtle); border-radius:6px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:6px; background:var(--acc); }
  .bar-fill.gray{ background:var(--text-faint); }
  .bar-fill.pos{ background:var(--positive-fg); }
  .bar-fill.warn{ background:var(--warn-fg); opacity:.55; }

  .goals-list{ display:flex; flex-direction:column; gap:12px; }
  .goals-list .row{ display:flex; justify-content:space-between; align-items:center; font-size:13px; }
  .goals-list .row .g-lbl{ color:var(--text-secondary); }
  .goals-list .row .g-val{ font-weight:600; font-family:'Space Grotesk'; }

  
  table{ width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); overflow:hidden; font-size:13.5px; }
  th{ text-align:left; font-weight:600; color:var(--text-muted); font-size:11.5px; letter-spacing:0.02em;
    padding:12px 14px; border-bottom:1px solid var(--border); background:var(--input-bg); cursor:pointer;
    user-select:none; white-space:nowrap; }
  th:hover{ color:var(--text-primary); }
  td{ padding:12px 14px; border-bottom:1px solid var(--border-subtle); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tbody tr{ cursor:pointer; transition:background .1s; }
  tbody tr:hover td{ background:var(--input-bg); }
  .lead-name{ font-weight:600; }
  .muted{ color:var(--text-muted); }
  .empty-state{ text-align:center; padding:30px; color:var(--text-muted); font-size:13.5px; }

  .table-row{ display:grid; grid-template-columns:1.7fr 1fr; gap:16px; margin-bottom:16px; }

  
  .history-block{ margin-top:18px; }
  .history-block .h-title{ font-size:12.5px; color:var(--text-muted); font-weight:600; margin-bottom:8px; }
  .history-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 14px;
    border-bottom:1px solid var(--border-subtle); font-size:13px; color:var(--text-muted); }
  .history-row:last-child{ border-bottom:none; }

  
  .footer-row{ display:grid; grid-template-columns:1.3fr 1fr; gap:16px; margin-top:16px; }
  .notion-table{ font-size:12.5px; }
  .notion-table th, .notion-table td{ padding:9px 10px; font-size:12px; }
  .copy-btn{ border:1px solid var(--border); background:var(--input-bg); color:var(--text-secondary);
    font-size:11px; font-weight:600; padding:4px 9px; border-radius:7px; cursor:pointer; }
  .copy-btn:hover{ background:var(--acc-tint); color:var(--acc); }

  .flag-box{ margin-top:16px; background:var(--warn-bg); color:var(--warn-fg); border-radius:12px;
    padding:14px 18px; font-size:13px; line-height:1.6; }
  .flag-box .flag-title{ font-weight:700; margin-bottom:6px; display:block; }
  .flag-box ul{ margin:0; padding-left:18px; }

  
  .scrim{ position:fixed; inset:0; background:rgba(20,20,30,0.28); display:none; z-index:10; }
  .scrim.open{ display:block; }
  .drawer{ position:fixed; top:0; right:-420px; width:400px; height:100%; background:var(--surface);
    box-shadow:-16px 0 44px rgba(20,20,40,0.14); z-index:11; transition:right .28s cubic-bezier(.2,.8,.2,1);
    display:flex; flex-direction:column; }
  .drawer.open{ right:0; }
  .drawer-header{ padding:24px; border-bottom:1px solid var(--border-subtle); }
  .drawer-header .top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
  .drawer-close{ width:32px; height:32px; border-radius:9px; border:1px solid var(--border); background:var(--surface);
    color:var(--text-secondary); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .drawer-close:hover{ background:var(--input-bg); }
  .drawer-header .company{ font-family:'Space Grotesk'; font-size:21px; font-weight:600; letter-spacing:-0.02em; margin:0 0 4px; }
  .drawer-header .owner{ font-size:12.5px; color:var(--text-muted); }
  .drawer-body{ padding:24px; overflow-y:auto; flex:1; }
  .stat-tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px; }
  .stat-tile{ background:var(--input-bg); border-radius:12px; padding:12px 14px; }
  .stat-tile .lbl{ font-size:11.5px; color:var(--text-muted); margin-bottom:4px; }
  .stat-tile .val{ font-size:14px; font-weight:600; }
  .timeline-eyebrow{ font-size:10.5px; font-weight:600; letter-spacing:0.06em; color:var(--text-faint); margin-bottom:14px; }
  .timeline{ position:relative; padding-left:22px; }
  .timeline .t-item{ position:relative; padding-bottom:20px; }
  .timeline .t-item:last-child{ padding-bottom:0; }
  .timeline .t-item::before{ content:''; position:absolute; left:-22px; top:2px; width:9px; height:9px; border-radius:50%; background:var(--text-faint); }
  .timeline .t-item.done::before{ background:var(--acc); }
  .timeline .t-item::after{ content:''; position:absolute; left:-18px; top:12px; width:1px; height:calc(100% - 4px); background:var(--border); }
  .timeline .t-item:last-child::after{ display:none; }
  .timeline .t-item .t-lbl{ font-size:13px; font-weight:600; }
  .timeline .t-item .t-note{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .drawer-link{ display:inline-block; margin-top:16px; font-size:12.5px; color:var(--acc); text-decoration:none; word-break:break-all; }
  .drawer-link:hover{ text-decoration:underline; }

  footer.pagefoot{ margin-top:22px; font-size:11.5px; color:var(--text-faint); text-align:center; }

  
  .an-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  .ch-block{ margin-bottom:14px; }
  .ch-block:last-child{ margin-bottom:0; }
  .ch-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;
    font-size:13px; font-weight:600; color:var(--text-primary); }
  .rate-num{ font-family:'Space Grotesk'; font-weight:600; font-size:14px; }
  .trend{ display:flex; align-items:flex-end; gap:14px; height:180px; padding-top:10px; }
  .trend-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .trend-bar{ width:70%; max-width:56px; background:var(--acc); border-radius:8px 8px 0 0; min-height:4px; }
  .trend-n{ font-family:'Space Grotesk'; font-weight:600; font-size:14px; margin-top:8px; }
  .trend-lbl{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }
  @media (max-width:820px){ .an-row{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<div class="app">
  <aside>
    <div class="brand">
      <div class="tile"><img id="logoImg" alt="logo"></div>
      <div class="lines">
        <span class="name">Rebecca Arnaud</span>
        <span class="sub">Sales HQ</span>
      </div>
    </div>
    <div class="eyebrow">MENU</div>
    <nav>
      <div class="item" data-view="overview">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
        <span>Visão geral</span>
      </div>
      <div class="item" data-view="semana">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4"></path><path d="M16 2v4"></path><path d="M3 9h18"></path></svg>
        <span>Semana</span>
      </div>
      <div class="item" data-view="leads">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v5l-4 2v-7z"></path></svg>
        <span>Leads &amp; Propostas</span>
      </div>
      <div class="item" data-view="leadsativas">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="17" rx="2"></rect><path d="M9 4h6"></path><path d="m8.5 13 2 2 4-4"></path></svg>
        <span>Leads Ativas</span>
      </div>
      <div class="item" data-view="followups">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg>
        <span>Follow-ups</span>
      </div>
      <div class="item" data-view="analytics">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M3 20h18"></path></svg>
        <span>Análises</span>
      </div>
      <div class="item" data-view="notion">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8"></path><path d="M8 12h8"></path><path d="M8 16h5"></path></svg>
        <span>Notion</span>
      </div>
      </nav>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-footer">
      <div class="avatar-round">RA</div>
      <div class="lines">
        <span class="name">Rebecca Arnaud</span>
        <span class="sub">Team lead</span>
      </div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div class="titles">
        <h1 id="viewTitle">Visão geral</h1>
        <span class="sub" id="viewSub">—</span>
      </div>
      <div class="controls">
        <div class="search-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9a9aa6" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.2-3.2"></path></svg>
          <input id="searchInput" placeholder="Buscar lead…">
        </div>
        <div class="week-toggle">
          <button id="weekPrev">‹</button>
          <span class="label" id="weekLabel">—</span>
          <button id="weekNext">›</button>
        </div>
        <div class="chips" id="channelChips"></div>
        <div class="segmented" id="typeToggle"></div>
      </div>
    </header>

    <div class="scrollbody" id="scrollBody"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="top">
      <span id="drawerBadge" class="badge acc">enviada</span>
      <button class="drawer-close" id="drawerClose">✕</button>
    </div>
    <div class="company" id="drawerCompany">—</div>
    <div class="owner" id="drawerOwner">—</div>
  </div>
  <div class="drawer-body">
    <div class="stat-tiles">
      <div class="stat-tile"><div class="lbl">Canal</div><div class="val" id="drawerCanal">—</div></div>
      <div class="stat-tile"><div class="lbl">Data</div><div class="val" id="drawerData">—</div></div>
    </div>
    <div class="timeline-eyebrow">LINHA DO TEMPO</div>
    <div class="timeline" id="drawerTimeline"></div>
    <a class="drawer-link" id="drawerLink" href="#" target="_blank" rel="noopener">—</a>
  </div>
</div>


<style>
  #pwgate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;
    background:#F5EFE6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  #pwgate .box{background:#fff;border:1px solid #e7ddd0;border-radius:16px;padding:38px 34px;width:min(360px,88vw);
    box-shadow:0 18px 50px rgba(74,52,40,.16);text-align:center}
  #pwgate .mono{width:52px;height:52px;border-radius:14px;background:#4A3428;color:#F5EFE6;font-weight:800;
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:19px;letter-spacing:.5px}
  #pwgate h1{margin:0 0 6px;font-size:19px;color:#4A3428;font-weight:750}
  #pwgate p{margin:0 0 22px;font-size:13.5px;color:#8a7a6a;line-height:1.5}
  #pwgate input{width:100%;box-sizing:border-box;padding:12px 14px;border:1.5px solid #e0d4c4;border-radius:10px;
    font-size:15px;color:#4A3428;background:#faf6f0;outline:none;transition:border-color .15s}
  #pwgate input:focus{border-color:#B08968}
  #pwgate button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:#4A3428;color:#F5EFE6;
    font-size:15px;font-weight:650;cursor:pointer;transition:background .15s}
  #pwgate button:hover{background:#5c4433}
  #pwgate .err{color:#b4442f;font-size:13px;margin-top:12px;min-height:16px}
</style>
<div id="pwgate">
  <div class="box">
    <div class="mono">RA</div>
    <h1>Rebecca Arnaud Design</h1>

  const ITER = 200000;
  const b64bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

  async function unlock(pw){
    const pack = b64bytes(CIPHER);
    const salt = pack.slice(0,16), iv = pack.slice(16,28), ct = pack.slice(28);
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name:"PBKDF2", salt, iterations:ITER, hash:"SHA-256" },
      km, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    const buf = await crypto.subtle.decrypt({ name:"AES-GCM", iv }, key, ct);
    return JSON.parse(new TextDecoder().decode(buf));
  }

  function runApp(data){
    document.getElementById("pwgate").remove();
    const b64 = document.getElementById("appcode").textContent;
    const code = new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
    new Function("DATA", code)(data);
  }

  document.getElementById("pwform").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = document.getElementById("pwerr"); err.textContent = "";
    try { runApp(await unlock(document.getElementById("pwinput").value)); }
    catch(_) { err.textContent = "Senha incorreta."; document.getElementById("pwinput").select(); }
  });
})();
